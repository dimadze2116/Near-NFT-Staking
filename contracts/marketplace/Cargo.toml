[package]
name = "nft-marketplace"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned deliberately. These contracts are deployed to mainnet, and an open
# "5.1.0" range resolves to whatever 5.x is newest at build time: near-sdk 5.30
# targets a different protocol version than the 5.29.1 the test suite runs
# against, so the range would deploy a binary no test has touched. Cargo.lock is
# committed for the same reason — the lock, not the range, is what makes a build
# reproducible.
near-sdk = { version = "~5.29.1", features = ["legacy"] }
borsh = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
