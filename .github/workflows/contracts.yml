# Integration tests for both contracts.
#
# They run here rather than on a developer's machine because near-workspaces
# starts a real nearcore sandbox, and that binary is published only for
# linux-x86_64, linux-aarch64 and darwin-arm64. On Windows it cannot run at all,
# so CI is the primary runner for this suite, not a convenience.

name: contracts

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

env:
  # Pinned deliberately: a new cargo-near release should not change what this
  # workflow builds without someone deciding to.
  CARGO_NEAR_VERSION: 0.22.0

jobs:
  integration-tests:
    # Pinned rather than ubuntu-latest, which is mid-migration to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # only to post the failure output as a commit comment

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/mock-nft
            contracts/staking
            contracts/marketplace
            contracts/integration-tests

      # Only cargo-near produces a working binary: since near-sdk 5.27 the
      # --cfg near flag is required, and a plain cargo build compiles, deploys,
      # and then traps at new(). The prebuilt release binary is used instead of
      # `cargo install`, which has to compile cargo-near and its whole tree.
      - name: Install cargo-near
        run: |
          set -euo pipefail
          url="https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/cargo-near.tar.gz
          mkdir -p /tmp/cargo-near && tar -xzf /tmp/cargo-near.tar.gz -C /tmp/cargo-near
          bin="$(find /tmp/cargo-near -type f -name cargo-near -perm -u+x | head -n1)"
          test -n "$bin" || { echo "cargo-near binary not found in archive:"; find /tmp/cargo-near -type f; exit 1; }
          install -m 0755 "$bin" "$HOME/.cargo/bin/cargo-near"
          cargo near --version

      - name: Build mock collection
        working-directory: contracts/mock-nft
        run: cargo near build non-reproducible-wasm --no-abi

      - name: Build staking contract
        working-directory: contracts/staking
        run: cargo near build non-reproducible-wasm --no-abi

      - name: Build marketplace contract
        working-directory: contracts/marketplace
        run: cargo near build non-reproducible-wasm --no-abi

      - name: Integration tests
        working-directory: contracts/integration-tests
        run: |
          set -o pipefail
          # --no-fail-fast so one failing binary does not hide the others:
          # each round trip through CI is expensive enough to want every result.
          cargo test --no-fail-fast -- --nocapture 2>&1 | tee /tmp/test-output.txt

      # Run logs are only served through signed storage URLs, which is awkward
      # to read from anywhere but a browser. On failure the tail of the output
      # is posted as a commit comment instead, where the API can reach it.
      - name: Post failure output as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`cargo test\` failed on \`${GITHUB_SHA:0:8}\`"
            echo
            echo '```'
            tail -c 55000 /tmp/test-output.txt || echo "(no output captured)"
            echo '```'
          } > /tmp/comment.md
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment.md
